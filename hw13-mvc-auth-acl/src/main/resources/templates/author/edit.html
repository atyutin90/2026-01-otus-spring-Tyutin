<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{author}">Author</title>
    <div th:replace="~{fragments/library}"></div>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="card shadow-sm p-4" style="width: 600px;">

        <h4 class="text-center mb-4" th:text="#{author}">Author</h4>

        <form th:action="@{/authors}" th:object="${author}" method="post">

            <!-- Сообщение об ошибке -->
            <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show text-center"
                 role="alert">
                <ul class="mb-3">
                    <span th:text="${errorMessage}"></span>
                </ul>
            </div>

            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label" th:text="#{author.full-name}">Full Name</label>
                <input type="text"
                       th:field="*{fullName}"
                       class="form-control"
                       th:placeholder="#{author.full-name.placeholder}"/>

                <div class="text-danger small"
                     th:if="${#fields.hasErrors('fullName')}"
                     th:errors="*{fullName}">
                </div>
            </div>

            <div class="d-flex justify-content-center gap-2 mt-3">

                <!-- list -->
                <a href="/authors" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-list"></i>
                </a>

                <!-- save -->
                <button type="submit" class="btn btn-outline-success btn-sm">
                    <i class="bi bi-check-lg"></i>
                </button>

            </div>

        </form>

    </div>

</div>

</body>

</html>
