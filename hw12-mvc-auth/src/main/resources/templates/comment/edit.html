<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{comment}">Comment</title>
    <div th:replace="~{fragments/library}"></div>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="card shadow-sm p-4" style="width: 600px;">

        <h4 class="text-center mb-4" th:text="#{comment}">Comment</h4>

        <form th:action="@{/books/__${bookId}__/comments}" th:object="${comment}" method="post">

            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label" th:text="#{comment.text}">Text</label>
                <textarea rows="5" cols="100"
                       th:field="*{text}"
                       class="form-control"
                       th:placeholder="#{comment.text.placeholder}">Text
                </textarea>

                <div class="text-danger small"
                     th:if="${#fields.hasErrors('text')}"
                     th:errors="*{text}">
                </div>
            </div>

            <div class="d-flex justify-content-center gap-2 mt-3">

                <!-- book -->
                <a th:href="@{/books/__${bookId}__}" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-book"></i>
                </a>

                <!-- save -->
                <button type="submit" class="btn btn-outline-success btn-sm">
                    <i class="bi bi-check-lg"></i>
                </button>

                <!-- delete -->
                <button th:if="${id != null}" type="button"
                        class="btn btn-outline-danger btn-sm"
                        data-bs-toggle="modal"
                        th:attr="data-bs-target='#deleteModal-' + ${comment.id}">
                    <i class="bi bi-trash"></i>
                </button>

            </div>
        </form>

        <!-- delete modal -->
        <div class="modal fade"
             th:id="'deleteModal-' + ${comment.id}"
             tabindex="-1"
             aria-hidden="true">

            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">

                    <div class="modal-body text-center">
                        <i class="bi bi-exclamation-triangle text-danger display-6"></i>
                        <p class="mt-3" th:text="#{modal-delete-message(${comment.text})}">
                            Are you sure you want to delete record?
                        </p>
                    </div>

                    <div class="modal-footer justify-content-center gap-2">

                        <!-- cancel -->
                        <button type="button"
                                class="btn btn-outline-secondary btn-sm"
                                data-bs-dismiss="modal">
                            <i class="bi bi-x-lg"></i>
                        </button>

                        <!-- delete -->
                        <form th:action="@{/books/__${bookId}__/comments/__${comment.id}__}" th:method="delete">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>

                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

</body>

</html>
