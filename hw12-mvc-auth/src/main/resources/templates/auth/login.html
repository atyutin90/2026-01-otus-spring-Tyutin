<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:replace="~{fragments/library}"></div>
<body>

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="w-100" style="max-width: 500px;">

        <!-- Логотип -->
        <div class="text-center mb-4">
            <i class="bi bi-book display-4"></i>
        </div>

        <!-- Ошибка входа -->
        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show text-center" role="alert">
            <span th:text="#{error.invalid-username-and-password}">Invalid username or password</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <!-- Форма входа -->
        <form th:action="@{/login}" method="post" class="mt-4">
            <div class="mb-3 text-center">
                <label for="username" class="form-label" th:text="#{user.username}">Username</label>
                <input type="text" class="form-control" id="username" name="username" th:placeholder="#{user.username.placeholder}">
            </div>

            <div class="mb-3 text-center">
                <label for="password" class="form-label" th:text="#{user.password}">Password</label>
                <input type="password" class="form-control" id="password" name="password" th:placeholder="#{user.password.placeholder}">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" th:text="#{sign-in}">Sign in</button>
                <a class="btn btn-secondary" th:href="@{/register}" th:text="#{register-user}">Register user</a>
            </div>

            <!-- Выбор локали -->
            <div class="d-flex justify-content-center gap-3 mt-3">

                <a th:href="@{/login(lang=en)}"
                   class="text-decoration-none fs-4"
                   th:classappend="${#locale.language == 'en'} ? 'opacity-100 border-bottom border-2' : 'opacity-50'">
                    🇬🇧
                </a>

                <a th:href="@{/login(lang=ru)}"
                   class="text-decoration-none fs-4"
                   th:classappend="${#locale.language == 'ru'} ? 'opacity-100 border-bottom border-2' : 'opacity-50'">
                    🇷🇺
                </a>

                <a th:href="@{/login(lang=ch)}"
                   class="text-decoration-none fs-4"
                   th:classappend="${#locale.language == 'ch'} ? 'opacity-100 border-bottom border-2' : 'opacity-50'">
                    🇨🇳
                </a>

            </div>
        </form>

    </div>
</div>

</body>

</html>
