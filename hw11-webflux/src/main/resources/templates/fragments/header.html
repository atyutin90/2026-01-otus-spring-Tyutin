<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">

            <div class="navbar-nav">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-house-door-fill text-warning"></i>
                </a>
                <a class="nav-link" th:text="#{books}" href="/books">
                    <i class="bi bi-book"></i>Books
                </a>
                <a class="nav-link" th:text="#{authors}" href="/authors">
                    <i class="bi bi-person"></i> Authors
                </a>
                <a class="nav-link" th:text="#{genres}" href="/genres">
                    <i class="bi bi-tags" th:text=""></i> Genres
                </a>
            </div>

            <div class="dropdown ms-auto">
                <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false"
                        th:text="${#locale.language == 'ru' ? '🇷🇺' : (#locale.language == 'ch' ? '🇨🇳' : '🇬🇧')}">
                </button>

                <ul class="dropdown-menu dropdown-menu-end">
                    <li><a class="dropdown-item" th:href="@{/(lang=en)}" th:text="#{english}">🇬🇧 EN</a></li>
                    <li><a class="dropdown-item" th:href="@{/(lang=ru)}" th:text="#{russian}">🇷🇺 RU</a></li>
                    <li><a class="dropdown-item" th:href="@{/(lang=ch)}" th:text="#{chinese}">🇨🇳 CH</a></li>
                </ul>
            </div>

        </div>
    </nav>
</header>
