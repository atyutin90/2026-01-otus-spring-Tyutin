<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{genre}">Genre</title>
    <div th:replace="~{fragments/library}"></div>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<div class="container flex-grow-1 d-flex align-items-center justify-content-center">

    <div class="card shadow-sm p-4" style="width: 600px;">

        <h4 class="text-center mb-4" th:text="#{genre}">Genre</h4>

        <form th:object="${genre}">

            <input type="hidden" th:field="*{id}"/>

            <div class="mb-3">
                <label class="form-label" th:text="#{genre.name}">Name</label>
                <input type="text"
                       th:field="*{name}"
                       class="form-control"
                       th:placeholder="#{genre.name.placeholder}"
                       disabled/>
            </div>

            <div class="d-flex justify-content-center gap-2 mt-3">

                <!-- list -->
                <a href="/genres" class="btn btn-outline-secondary btn-sm">
                    <i class="bi bi-list"></i>
                </a>

                <!-- edit -->
                <a th:href="@{/genres/__${genre.id}__/edit}"
                   class="btn btn-outline-primary btn-sm">
                    <i class="bi bi-pencil"></i>
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
