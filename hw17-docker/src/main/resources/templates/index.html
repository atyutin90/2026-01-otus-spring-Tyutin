<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="#{library}">Library</title>
    <div th:replace="~{fragments/library}"></div>
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div th:replace="~{fragments/header :: header}"></div>

<!-- content -->
<div class="container flex-grow-1 d-flex align-items-center">
    <div class="row w-100 g-4">

        <div class="col-md-4">
            <a href="/books" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-book display-4"></i>
                        <h4 class="mt-3" th:text="#{books}">Books</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/authors" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-person display-4"></i>
                        <h4 class="mt-3" th:text="#{authors}">Authors</h4>
                    </div>
                </div>
            </a>
        </div>

        <div class="col-md-4">
            <a href="/genres" class="text-decoration-none">
                <div class="card text-center h-100 shadow-sm">
                    <div class="card-body">
                        <i class="bi bi-tags display-4"></i>
                        <h4 class="mt-3" th:text="#{genres}">Genres</h4>
                    </div>
                </div>
            </a>
        </div>

    </div>

</div>

</body>
</html>
