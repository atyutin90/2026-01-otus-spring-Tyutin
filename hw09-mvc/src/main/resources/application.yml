spring:
  datasource:
    url: jdbc:h2:mem:maindb
  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema.sql
  jpa:
    open-in-view: false
    generate-ddl: false
    hibernate:
      ddl-auto: none
    show-sql: false
  h2:
    console:
      path: /h2-console
      settings:
        web-allow-others: true
  #Обработка ошибки NoHandlerFoundException в @ControllerAdvice при переходе на неизвестный url
  web:
    resources.add-mappings: false
  #Туннелирование запроса DELETE через POST
  mvc:
    hiddenmethod:
      filter:
        enabled: true